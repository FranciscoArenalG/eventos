<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Barbara Birthday Invitation</title>

  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;

      background:
        linear-gradient(to bottom,
          #78d3ff,
          #bcecff);
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* =========================
       LOADER
    ========================== */

    .loader {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      background:
        linear-gradient(to bottom,
          #5ec6ff,
          #1d7eff);

      transition: 1s ease;
    }

    .loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      text-align: center;
      font-size:
        clamp(3rem, 8vw, 7rem);

      color: #ffe066;

      text-shadow:
        0 4px 0 #d32f2f,
        0 0 25px rgba(255, 255, 255, .5);

      animation:
        bounce 1.5s infinite;
    }

    .loader-text {
      text-align: center;
      margin-top: 20px;
      color: white;
      letter-spacing: 5px;
    }

    /* =========================
       SKY
    ========================== */

    .sky {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(to bottom,
          #72cfff,
          #bdeaff);
    }

    /* =========================
       CLOUDS
    ========================== */

    .cloud {
      position: absolute;

      background: white;

      border-radius: 100px;

      opacity: .95;

      filter:
        drop-shadow(0 10px 20px rgba(0, 0, 0, .08));
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 70px;
      height: 70px;
      top: -30px;
      left: 15px;
    }

    .cloud::after {
      width: 90px;
      height: 90px;
      top: -40px;
      right: 15px;
    }

    .cloud1 {
      width: 220px;
      height: 70px;

      top: 10%;
      left: 5%;

      animation:
        floatCloud 20s infinite alternate;
    }

    .cloud2 {
      width: 260px;
      height: 90px;

      top: 30%;
      right: 10%;

      animation:
        floatCloud 25s infinite alternate-reverse;
    }

    .cloud3 {
      width: 180px;
      height: 60px;

      top: 60%;
      left: 25%;

      animation:
        floatCloud 18s infinite alternate;
    }

    /* =========================
       SUN LIGHT
    ========================== */

    .sunlight {
      position: absolute;

      width: 1000px;
      height: 1000px;

      top: -350px;
      right: -350px;

      background:
        radial-gradient(circle,
          rgba(255, 255, 255, .6),
          transparent 70%);

      animation:
        pulse 8s infinite;
    }

    /* =========================
       FLOOR
    ========================== */

    .floor {
      position: absolute;

      bottom: 0;
      width: 100%;
      height: 28vh;

      background:
        repeating-linear-gradient(90deg,
          #d89453 0px,
          #d89453 70px,
          #c37d3a 70px,
          #c37d3a 74px);

      box-shadow:
        inset 0 10px 30px rgba(0, 0, 0, .2);
    }

    /* =========================
       MAIN CONTENT
    ========================== */

    .intro {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      z-index: 20;

      text-align: center;

      padding: 20px;
    }

    .mini-title {

      color: black;

      letter-spacing: 8px;

      font-size: 1rem;

      text-shadow:
        0 2px 10px rgba(0, 0, 0, .2);

      opacity: 0;

      animation:
        fadeUp 1.5s forwards;
    }

    .main-title {

      margin-top: 20px;

      font-size:
        clamp(2rem, 12vw, 10rem);

      color: #ffe066;

      text-shadow:
        0 4px 0 #d32f2f,
        0 10px 30px rgba(0, 0, 0, .25);

      transform:
        scale(.2) rotate(-10deg);

      opacity: 0;

      animation:
        titleEntrance 2.5s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .birthday {

      margin-top: 15px;

      color: black;

      font-size:
        clamp(1.2rem, 4vw, 2.3rem);

      letter-spacing: 4px;

      opacity: 0;

      animation:
        fadeIn 2s ease 1s forwards;
    }

    /* =========================
       CARD
    ========================== */

    .card {

      margin-top: 30px;

      background:
        rgba(255, 255, 255, .25);

      backdrop-filter: blur(10px);

      border-radius: 30px;

      padding: 25px 35px;

      color: white;

      box-shadow:
        0 20px 40px rgba(0, 0, 0, .15);

      opacity: 0;

      animation:
        fadeIn 2s ease 1.5s forwards;
    }

    .card p {
      color: black;
      margin: 12px 0;
      font-size: 1.2rem;
    }

    /* =========================
       COUNTDOWN
    ========================== */

    .countdown {

      display: flex;
      gap: 15px;

      justify-content: center;
      flex-wrap: wrap;

      margin-top: 25px;

      opacity: 0;

      animation:
        fadeIn 2s ease 2s forwards;
    }

    .time-box {

      width: 100px;
      height: 100px;

      background:
        rgba(255, 255, 255, .25);

      border-radius: 20px;

      backdrop-filter: blur(10px);

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      color: white;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, .15);
    }

    .time-box span {
      font-size: 2rem;
      font-weight: bold;
    }

    /* =========================
       BUTTONS
    ========================== */

    .button {

      margin-top: 30px;

      background: #ff5252;
      color: white;

      border: none;
      border-radius: 50px;

      padding: 18px 40px;

      font-size: 1rem;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, .2);

      transition: .3s;

      opacity: 0;

      animation:
        fadeIn 2s ease 2.5s forwards;
    }

    .button:hover {
      transform: scale(1.05);
    }

    .whatsapp-btn {

      margin-top: 20px;

      background: #25D366;
      color: white;

      text-decoration: none;

      padding: 18px 35px;

      border-radius: 50px;

      font-weight: bold;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, .2);

      transition: .3s;

      opacity: 0;

      animation:
        fadeIn 2s ease 3s forwards;
    }

    .whatsapp-btn:hover {
      transform: scale(1.05);
    }

    /* =========================
       BLOCKS
    ========================== */

    .blocks {

      position: absolute;

      bottom: 24vh;

      width: 100%;

      display: flex;
      justify-content: center;
      gap: 18px;

      z-index: 10;
    }

    .block {

      width: 90px;
      height: 90px;

      border-radius: 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 2rem;
      font-weight: bold;

      color: white;

      box-shadow:
        0 12px 25px rgba(0, 0, 0, .18);

      animation:
        jump 2s infinite;
    }

    .block:nth-child(1) {
      background: #ff5252;
    }

    .block:nth-child(2) {
      background: #42a5f5;
      animation-delay: .2s;
    }

    .block:nth-child(3) {
      background: #66bb6a;
      animation-delay: .4s;
    }

    .block:nth-child(4) {
      background: #ffca28;
      animation-delay: .6s;
    }
    .block:nth-child(5) {
      background: #6F4E37;
      animation-delay: .6s;
    }

    /* =========================
       BALLOONS
    ========================== */

    .balloon {

      position: absolute;

      width: 70px;
      height: 90px;

      border-radius: 50%;

      animation:
        balloonFloat 6s infinite ease-in-out;

      z-index: 5;
    }

    .balloon::after {

      content: '';

      position: absolute;

      width: 2px;
      height: 120px;

      background:
        rgba(255, 255, 255, .8);

      left: 50%;
      top: 90px;
    }

    .b1 {
      background: #ff5252;
      left: 8%;
      top: 20%;
    }

    .b2 {
      background: #42a5f5;
      right: 10%;
      top: 18%;
      animation-delay: 1s;
    }

    .b3 {
      background: #ffee58;
      left: 20%;
      top: 55%;
      animation-delay: 2s;
    }

    /* =========================
       CONFETTI
    ========================== */

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 15;
    }

    .piece {

      position: absolute;

      width: 8px;
      height: 16px;

      opacity: .8;

      animation:
        confettiFall linear infinite;
    }

    /* =========================
       MUSIC BUTTON
    ========================== */

    .music-btn {

      position: absolute;

      top: 20px;
      right: 20px;

      width: 60px;
      height: 60px;

      border: none;
      border-radius: 50%;

      background:
        rgba(255, 255, 255, .3);

      backdrop-filter: blur(10px);

      color: white;

      font-size: 1.5rem;

      cursor: pointer;

      z-index: 50;
    }

    /* =========================
       STARS
    ========================== */

    .star {

      position: absolute;

      width: 4px;
      height: 4px;

      background: white;

      border-radius: 50%;

      animation:
        twinkle 3s infinite;
    }

    /* =========================
       PARTICLES
    ========================== */

    .particle {

      position: absolute;

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, .8);

      animation:
        floatParticle linear infinite;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes titleEntrance {

      0% {
        opacity: 0;

        transform:
          scale(.2) rotate(-20deg) translateY(200px);
      }

      70% {
        opacity: 1;

        transform:
          scale(1.08) rotate(5deg) translateY(0);
      }

      100% {
        opacity: 1;

        transform:
          scale(1) rotate(-2deg) translateY(0);
      }
    }

    @keyframes floatCloud {

      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(120px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes jump {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes balloonFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    @keyframes confettiFall {

      from {
        transform:
          translateY(-10vh) rotate(0deg);
      }

      to {
        transform:
          translateY(110vh) rotate(720deg);
      }
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .3;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(2);
      }
    }

    @keyframes floatParticle {

      from {
        transform: translateY(100vh);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      to {
        transform: translateY(-20vh);
        opacity: 0;
      }
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:768px) {

      .card {
        width: 90%;
      }

      .blocks {
        gap: 10px;
      }

      .block {
        width: 65px;
        height: 65px;
        font-size: 1.5rem;
      }

      .balloon {
        width: 50px;
        height: 70px;
      }

      .time-box {
        width: 80px;
        height: 80px;
      }

    }
  </style>

</head>

<body>

  <!-- LOADER -->

  <div class="loader" id="loader">

    <div class="loader-logo">
      BARBARA REGINA
    </div>

    <div class="loader-text">
      CARGANDO AVENTURA...

    </div>
    <img src="jessie.gif" alt="" srcset="">
  </div>

  <!-- SCENE -->

  <div class="scene">


    <div class="sky"><img src="jessie-estatica.gif" alt=""></div>

    <div class="sunlight"></div>

    <!-- CLOUDS -->

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- BALLOONS -->

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>

    <!-- BLOCKS -->

    <div class="blocks">

      <div class="block">2</div>
      <div class="block">A</div>
      <div class="block">Ñ</div>
      <div class="block">O</div>
      <div class="block">S</div>

    </div>

    <!-- INTRO -->

    <div class="intro">

      <div class="mini-title">
        Estás invitado al cumpleaños de
      </div>

      <div class="main-title">
        BARBARA REGINA
      </div>

      <div class="birthday">
        ¡CELEBRA CON NOSOTROS!
      </div>

      <!-- CARD -->

      <div class="card">

        <p>🎂 Cumpleaños Infantil</p>

        <p>📅 01 Agosto 2026</p>

        <p>⏰ 13:00 Horas</p>

        <p>📍 Mi Casita</p>

      </div>

      <!-- COUNTDOWN -->

      <div class="countdown">

        <div class="time-box">
          <span id="days">00</span>
          <small>Días</small>
        </div>

        <div class="time-box">
          <span id="hours">00</span>
          <small>Horas</small>
        </div>

        <div class="time-box">
          <span id="minutes">00</span>
          <small>Min</small>
        </div>

      </div>

      <!-- BUTTON -->

      <!-- <button class="button">
        CONFIRMAR ASISTENCIA
      </button> -->

      <!-- WHATSAPP -->

      <a href="https://wa.me/5535296643" target="_blank" class="whatsapp-btn">

        CONFIRMAR POR WHATSAPP

      </a>

    </div>

    <!-- FLOOR -->

    <div class="floor"></div>

    <!-- CONFETTI -->

    <div class="confetti" id="confetti"></div>

    <!-- MUSIC BUTTON -->

    <button class="music-btn" id="musicBtn">

      ♪

    </button>

  </div>


  <!-- MUSIC -->

  <audio id="music" loop>

    <source src="toy-story-music.mp3" type="audio/mpeg">

  </audio>

  <!-- JAVASCRIPT -->

  <script>

    // =========================
    // LOADER
    // =========================

    window.addEventListener('load', () => {

      setTimeout(() => {

        document
          .getElementById('loader')
          .classList.add('hide');

      }, 2500);

    });

    // =========================
    // CONFETTI
    // =========================

    const confetti =
      document.getElementById('confetti');

    const colors = [
      '#ff5252',
      '#42a5f5',
      '#ffee58',
      '#66bb6a',
      '#ff80ab'
    ];

    for (let i = 0; i < 120; i++) {

      const piece =
        document.createElement('div');

      piece.classList.add('piece');

      piece.style.left =
        Math.random() * 100 + 'vw';

      piece.style.background =
        colors[
        Math.floor(
          Math.random() * colors.length
        )
        ];

      piece.style.animationDuration =
        (Math.random() * 4 + 4) + 's';

      piece.style.animationDelay =
        Math.random() * 5 + 's';

      confetti.appendChild(piece);
    }

    // =========================
    // COUNTDOWN
    // =========================

    const targetDate =
      new Date('2026-08-01T13:00:00');

    function updateCountdown() {

      const now = new Date();

      const diff =
        targetDate - now;

      const days =
        Math.floor(
          diff / (1000 * 60 * 60 * 24)
        );

      const hours =
        Math.floor(
          (
            diff %
            (1000 * 60 * 60 * 24)
          )
          /
          (1000 * 60 * 60)
        );

      const minutes =
        Math.floor(
          (
            diff %
            (1000 * 60 * 60)
          )
          /
          (1000 * 60)
        );

      document
        .getElementById('days')
        .innerHTML = days;

      document
        .getElementById('hours')
        .innerHTML = hours;

      document
        .getElementById('minutes')
        .innerHTML = minutes;
    }

    setInterval(updateCountdown, 1000);

    updateCountdown();

    // =========================
    // STARS
    // =========================

    for (let i = 0; i < 80; i++) {

      const star =
        document.createElement('div');

      star.classList.add('star');

      star.style.left =
        Math.random() * 100 + 'vw';

      star.style.top =
        Math.random() * 100 + 'vh';

      star.style.animationDelay =
        Math.random() * 5 + 's';

      document.body.appendChild(star);
    }

    // =========================
    // FLOAT PARTICLES
    // =========================

    for (let i = 0; i < 50; i++) {

      const particle =
        document.createElement('div');

      particle.classList.add('particle');

      particle.style.left =
        Math.random() * 100 + 'vw';

      particle.style.animationDuration =
        (Math.random() * 8 + 6) + 's';

      particle.style.animationDelay =
        Math.random() * 10 + 's';

      document.body.appendChild(particle);
    }

    // =========================
    // MUSIC
    // =========================

    const music =
      document.getElementById('music');

    const musicBtn =
      document.getElementById('musicBtn');

    let playing = false;

    musicBtn.addEventListener('click', () => {

      if (!playing) {

        music.play();

        musicBtn.innerHTML = '♫';

      } else {

        music.pause();

        musicBtn.innerHTML = '♪';
      }

      playing = !playing;

    });

    // =========================
    // CAMERA EFFECT
    // =========================

    let move = 0;

    function animate() {

      move += 0.01;

      document
        .querySelector('.scene')
        .style.transform =
        `translateY(${Math.sin(move) * 2}px)`;

      requestAnimationFrame(animate);
    }

    animate();

  </script>

</body>

</html>
